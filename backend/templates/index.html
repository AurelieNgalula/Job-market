<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche d'emploi - Semantic Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .search-box input {
            flex: 1;
            min-width: 0;
        }
        .search-box button {
            white-space: nowrap;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .results {
            min-height: 200px;
        }
        .result-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 4px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .result-item:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }
        .result-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .result-score {
            font-size: 12px;
            color: #999;
        }
        .score-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .score-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
        .loading {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Recherche d'emploi</h1>
        <p class="subtitle">Recherche sémantique - Trouver les offres qui vous correspondent</p>

        <div class="search-box">
            <input
                id="query"
                type="text"
                placeholder="Ex: développeur python, data scientist..."
                onkeypress="if(event.key==='Enter') search()"
            >
            <input
                id="location"
                type="text"
                placeholder="Lieu (optionnel)"
                onkeypress="if(event.key==='Enter') search()"
            >
            <button onclick="search()">Chercher</button>
        </div>

        <div id="results" class="results"></div>
    </div>

    <script>
        async function search() {
            const query = document.getElementById("query").value.trim();
            const location = document.getElementById("location").value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = '<div class="loading">⏳ Recherche en cours...</div>';

            try {
                const response = await fetch(`/search?query=${encodeURIComponent(query)}&location=${encodeURIComponent(location)}`);
                const data = await response.json();

                if (!data || data.length === 0) {
                    resultsDiv.innerHTML = '<div class="loading">Aucun résultat trouvé</div>';
                    return;
                }

                resultsDiv.innerHTML = data.map(item => {
                    const score = typeof item.score === 'number' ? item.score : 0;
                    const competences = Array.isArray(item.competences) && item.competences.length > 0
                        ? item.competences.slice(0, 5).join(", ")
                        : "Non spécifiées";

                    return `
                        <div class="result-item">
                            <div class="result-title">${escapeHtml(item.title)}</div>
                            <div class="result-score">
                                Lieu: ${escapeHtml(item.location || "Non spécifié")}
                            </div>
                            <div class="result-score">
                                Date: ${escapeHtml(formatDate(item.date_actualisation))}
                            </div>
                            <div class="result-score">
                                Compétences: ${escapeHtml(competences)}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Erreur: ${error.message}</div>`;
            }
        }

        function formatDate(value) {
            if (!value) return 'Non disponible';

            const date = new Date(value);
            if (Number.isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleDateString('fr-FR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) {
                return '';
            }

            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        document.getElementById("query").focus();
    </script>
</body>
</html>
